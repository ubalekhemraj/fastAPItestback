version: "3.9"

services:
  sync-service:
    build:
      context: ./sync_service
    container_name: sync-service
    ports:
      - "8000:8000"
    environment:
      - ENV=local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  async-service:
    build:
      context: ./async_service
    container_name: async-service
    ports:
      - "8001:8001"
    environment:
      - ENV=local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
